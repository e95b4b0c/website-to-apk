id = jupyter
name = Jupyter
mainURL = http://100.88.226.45:8888
icon = Jupyter_logo.svg.png

allowSubdomains = true # 允许在 example.com 与 sub.example.com 之间跳转
requireDoubleBackToExit = true # 需要连续按两次返回键才能退出应用

enableExternalLinks = true # 允许外部链接
openExternalLinksInBrowser = true # 若允许外部链接：在浏览器或 WebView 中打开
confirmOpenInBrowser = false # 打开外部浏览器前显示确认提示
allowOpenMobileApp = false # 禁止打开外部应用链接/协议

JSEnabled = true # 启用 JavaScript 执行
JSCanOpenWindowsAutomatically = true # 允许 JavaScript 自动打开新窗口/弹窗

DomStorageEnabled = true # 启用 HTML5 DOM 本地存储
# 以下为上游新版本新增的可选项（显式写出，便于按需调整）
MediaPlaybackRequiresUserGesture = true # 需要用户手势才允许播放媒体
allowSslErrors = false # 证书错误时是否允许用户确认后继续（自签名证书需为 true）
pullToRefresh = false # 下拉刷新页面
AllowFileAccess = true # 允许访问本地文件
AllowFileAccessFromFileURLs = true # 允许从 file:// URL 访问本地文件
forceLandscapeMode = false # 锁定屏幕方向为横屏

showDetailsOnErrorScreen = true # 在错误页面向用户显示连接错误详情
confirmOpenExternalApp = true # 打开外部应用前显示确认提示
blockLocalhostRequests = false # 阻止对 127.0.0.1 的请求
trustUserCA = false # 是否信任用户安装的 SSL 证书
geolocationEnabled = false # 是否允许访问设备地理位置（GPS）
cameraEnabled = false # 是否允许访问摄像头（用于 WebRTC 或扫描）
microphoneEnabled = false # 是否允许访问麦克风（用于录音或通话）
allowMixedContent = false # 是否允许在 HTTPS 页面中加载 HTTP 内容
cacheMode = default # 缓存模式：也可选 "no_cache"（始终走网络）、"aggressive"（离线优先）
fadeInDuration = 400 # 加载动画消失后 WebView 淡入动画时长（毫秒）
